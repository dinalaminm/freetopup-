<!-- START OF FILE Home Page (Updated Categories & Login Logic) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREE TOPUP PRO - Home</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Roboto:wght@300;400;500;700&family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Roboto', 'Noto Serif Bengali', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f0f5ff; }
        [v-cloak] { display: none !important; }
        .font-serif { font-family: 'Bree Serif', serif; letter-spacing: 0.5px; }
        .product-card { transition: transform 0.2s ease; overflow: hidden; background: white; }
        .product-card:active { transform: scale(0.95); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: #64748b; cursor: pointer; text-decoration: none; transition: color 0.2s ease; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: #583cb3; font-weight: 700; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .section-title { color: #1e3a8a; font-family: 'Bree Serif', serif; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    </style>
</head>
<body class="bg-[#f0f5ff]">

    <div id="app" v-cloak class="max-w-md mx-auto bg-[#f0f5ff] min-h-screen relative flex flex-col">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-200">
            <div class="px-3 py-2 flex justify-between items-center">
                <a href="index.html" class="flex items-center gap-1 cursor-pointer no-underline">
                    <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center text-white font-bold text-xl relative">
                        <span class="z-10">F</span>
                        <div class="absolute w-2 h-2 bg-purple-500 rounded-full top-0 right-0"></div>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="font-black text-lg tracking-tight text-black">FREE</span>
                        <span class="font-bold text-[10px] text-purple-700 tracking-widest">TOPUP PRO</span>
                    </div>
                </a>
                
                <!-- Login/Profile Section -->
                <div class="flex items-center gap-2">
                    <div v-if="isLoggedIn" class="flex items-center gap-2">
                        <!-- Add Money Button -->
                        <button @click="handleProtectedAction('add-money.html')" class="bg-[#583cb3] text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm hover:bg-purple-800 transition">
                            <i class="fa-solid fa-wallet"></i> {{ userBalance }} ৳
                        </button>
                        <!-- Profile Picture -->
                        <a href="account.html" class="w-8 h-8 rounded-full overflow-hidden border border-gray-300">
                            <img :src="userAvatar" class="w-full h-full object-cover">
                        </a>
                    </div>
                    <div v-else>
                        <a href="login.html" class="bg-gray-900 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-black transition">
                            Login <i class="fa-solid fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Notice Bar -->
        <div class="bg-[#4c3db2] text-white py-2 px-3 flex items-center gap-2 shadow-md">
            <span class="font-bold text-white text-[10px] bg-white/20 px-2 py-0.5 rounded uppercase tracking-wider">Notice</span>
            <marquee class="text-xs font-medium tracking-wide">{{ noticeMessage }}</marquee>
        </div>

        <!-- Main Content -->
        <main class="pb-24 px-3 flex-grow">
            <!-- Loading Spinner -->
            <div v-if="loading" class="flex flex-col justify-center items-center h-64">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-700 mb-4"></div>
                <p class="text-gray-500 text-sm">Products Loading...</p>
            </div>

            <div v-else>
                <!-- Banner Slider -->
                <div v-if="banners.length > 0" class="mt-3 rounded-xl overflow-hidden shadow-sm bg-white">
                    <div class="swiper mySwiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide" v-for="(banner, index) in banners" :key="index">
                                <img :src="banner" class="w-full h-40 object-cover">
                            </div>
                        </div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <!-- 1. MYSTERY & SPECIAL OFFERS -->
                <div v-if="mysteryBoxes.length > 0">
                    <h2 class="section-title"><i class="fa-solid fa-gift text-purple-600"></i> MYSTERY BOX</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div v-for="item in mysteryBoxes" :key="item.id" @click="goToDetails(item.id)" class="flex flex-col items-center cursor-pointer">
                            <div class="product-card w-full aspect-square relative group rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-white">
                                <img :src="item.image" @error="handleImageError" class="w-full h-full object-cover">
                            </div>
                            <h3 class="mt-2 font-bold text-xs text-gray-800 text-center">{{ item.name }}</h3>
                        </div>
                    </div>
                </div>

                <div v-if="specialOffers.length > 0">
                    <h2 class="section-title"><i class="fa-solid fa-fire text-orange-500"></i> SPECIAL OFFERS</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div v-for="item in specialOffers" :key="item.id" @click="goToDetails(item.id)" class="product-card aspect-[4/3] relative rounded-xl overflow-hidden shadow-sm border border-gray-100 group cursor-pointer">
                            <img :src="item.image" @error="handleImageError" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/80 to-transparent text-white text-[10px] text-center py-2 font-bold">{{ item.name }}</div>
                        </div>
                    </div>
                </div>

                <!-- 2. GAMES (Free Fire & Ingame) -->
                <div v-if="gameItems.length > 0">
                    <h2 class="section-title"><i class="fa-solid fa-gamepad text-blue-600"></i> POPULAR GAMES</h2>
                    <div class="grid grid-cols-3 gap-3">
                        <div v-for="item in gameItems" :key="item.id" @click="goToDetails(item.id)" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition">
                            <img :src="item.image" @error="handleImageError" class="w-full h-16 object-contain mb-2 rounded-md">
                            <h3 class="text-[10px] font-bold text-center text-gray-700 leading-tight">{{ item.name }}</h3>
                        </div>
                    </div>
                </div>

                <!-- 3. SHELLS & CARDS -->
                <div v-if="otherItems.length > 0">
                    <h2 class="section-title"><i class="fa-solid fa-ticket text-green-600"></i> CARDS & SUBSCRIPTION</h2>
                    <div class="grid grid-cols-3 gap-3">
                        <div v-for="item in otherItems" :key="item.id" @click="goToDetails(item.id)" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition">
                            <img :src="item.image" @error="handleImageError" class="w-full h-16 object-contain mb-2 rounded-md">
                            <h3 class="text-[10px] font-bold text-center text-gray-700 leading-tight">{{ item.name }}</h3>
                        </div>
                    </div>
                </div>
                
                <div class="h-6"></div>
            </div>
        </main>

        <!-- Bottom Nav -->
        <div class="fixed bottom-0 w-full bg-white border-t border-gray-200 z-50 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="grid grid-cols-5 h-16 max-w-md mx-auto">
                <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
                <button @click="handleProtectedAction('add-money.html')" class="nav-item bg-transparent border-0"><i class="fa-solid fa-wallet"></i><span>Add Money</span></button>
                <button @click="handleProtectedAction('orders.html')" class="nav-item bg-transparent border-0"><i class="fa-solid fa-file-invoice"></i><span>My Orders</span></button>
                <button @click="handleProtectedAction('codes.html')" class="nav-item bg-transparent border-0"><i class="fa-solid fa-gift"></i><span>My Codes</span></button>
                <button @click="handleProtectedAction('account.html')" class="nav-item bg-transparent border-0"><i class="fa-solid fa-user"></i><span>Account</span></button>
            </div>
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- Vue & Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { createApp, ref, onMounted, nextTick } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

        const firebaseConfig = {
          apiKey: "AIzaSyACUK207BRvtR5yc1UhYLS9FlMitVVlrrE",
          authDomain: "freetopup-fd263.firebaseapp.com",
          projectId: "freetopup-fd263",
          storageBucket: "freetopup-fd263.firebasestorage.app",
          messagingSenderId: "756173302110",
          appId: "1:756173302110:web:14227664f6b5d14d9047cf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        createApp({
            setup() {
                const loading = ref(true);
                const isLoggedIn = ref(false);
                const userBalance = ref(0);
                const userAvatar = ref('https://i.pravatar.cc/150?img=12');
                const noticeMessage = ref("লোড হচ্ছে...");
                const banners = ref([]);
                
                // Categorized Products
                const mysteryBoxes = ref([]);
                const specialOffers = ref([]);
                const gameItems = ref([]); // Free Fire + Ingame
                const otherItems = ref([]); // Shells + Cards + Subscriptions

                const handleProtectedAction = (url) => {
                    if (isLoggedIn.value) {
                        window.location.href = url;
                    } else {
                        window.location.href = "login.html";
                    }
                };

                const goToDetails = (id) => {
                    if (id) window.location.href = `details.html?id=${id}`;
                };

                const handleImageError = (e) => { e.target.src = "https://placehold.co/400x400?text=No+Image"; };

                const initUserData = () => {
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            isLoggedIn.value = true;
                            onSnapshot(doc(db, "users", user.uid), (doc) => {
                                if (doc.exists()) {
                                    userBalance.value = doc.data().balance || 0;
                                    userAvatar.value = doc.data().photoURL || 'https://i.pravatar.cc/150?img=12';
                                }
                            });
                        } else {
                            isLoggedIn.value = false;
                            userBalance.value = 0;
                        }
                    });
                };

                const fetchData = async () => {
                    try {
                        try {
                            const nSnap = await getDoc(doc(db, "settings", "notice"));
                            if(nSnap.exists()) noticeMessage.value = nSnap.data().text;
                        } catch(e) {}

                        // 🔥 NEW: Categories Sorting Logic 🔥
                        const productsSnap = await getDocs(collection(db, "products"));
                        productsSnap.forEach((doc) => {
                            const item = { id: doc.id, ...doc.data() };
                            const cat = item.category;

                            if (cat === 'mystery') mysteryBoxes.value.push(item);
                            else if (cat === 'special') specialOffers.value.push(item);
                            else if (cat === 'freefire' || cat === 'ingame') gameItems.value.push(item);
                            else if (cat === 'shell' || cat === 'giftcard' || cat === 'subscription') otherItems.value.push(item);
                            else gameItems.value.push(item); // Default fallback
                        });

                        const bannerSnap = await getDocs(collection(db, "banners"));
                        banners.value = bannerSnap.docs.map(doc => doc.data().image);

                        loading.value = false;
                        await nextTick();
                        new Swiper(".mySwiper", {
                            loop: true, autoplay: { delay: 3000, disableOnInteraction: false },
                            pagination: { el: ".swiper-pagination", clickable: true },
                        });

                    } catch (error) {
                        console.error("Error:", error);
                        loading.value = false;
                    }
                };

                onMounted(() => {
                    fetchData();
                    initUserData();
                });

                return {
                    loading, isLoggedIn, noticeMessage, banners, 
                    userBalance, userAvatar,
                    mysteryBoxes, specialOffers, gameItems, otherItems,
                    goToDetails, handleImageError, handleProtectedAction
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
